name: Validate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version X.Y.Z to test-build. Leave empty for the newest ready version."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-$(.github/scripts/upstream-versions.sh "$(grep -oP 'MIN_VERSION: "\K[^"]+' .github/workflows/build.yml)" | tail -n1)}"
          [ -n "$v" ] || { echo "::error::No ready upstream version found"; exit 1; }
          echo "Testing upstream version $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 (load for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: otel-fleet-collector:test
          load: true

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/otelcol-contrib otel-fleet-collector:test --version
          docker run --rm --entrypoint /usr/local/bin/opampsupervisor otel-fleet-collector:test --help
          docker image inspect otel-fleet-collector:test \
            --format 'user={{.Config.User}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} volumes={{json .Config.Volumes}}'

      - name: Build linux/amd64 + linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: false
